# kas base configuration for meta-rcar-s4 (Yocto 6.0 / wrynose).
#
# Pins match the wrynose-2026-10-31 release (README "Release pins").
# meta-rcar-s4 itself is referenced as the local checkout (run kas from a
# release tag checkout for reproducible builds, same model as build.sh).
#
# Layout note: wrynose splits oe-core/bitbake/meta-yocto into separate repos.
# kas clones them side by side in KAS_WORK_DIR; oe-buildenv-internal finds
# bitbake at $OEROOT/../bitbake, so no path hack is needed.
header:
  version: 23

build_system: openembedded
distro: poky
target: core-image-minimal

env:
  # Forwarded to bitbake when set externally (reuse caches across builds):
  DL_DIR: null
  SSTATE_DIR: null
  SSTATE_MIRRORS: null
  # Note: kas reads KAS_WORK_DIR from the *shell* environment before parsing
  # this file; run via ./build-with-kas.sh (sets ./build/kas) or export it.

repos:
  # Current repo (where this file lives): added as a layer, used as checked out.
  # Layer prio mirrors build.sh's BBLAYERS order (higher prio = earlier in
  # bblayers.conf = lower override precedence): poky > meta-yocto >
  # meta-rcar-s4 > meta-openembedded.
  meta-rcar-s4:
    layers:
      '.':
        prio: 20
  poky:
    url: https://git.openembedded.org/openembedded-core
    commit: ae5a301091f5b0574ea7444aab40b309b6d9f3f2
    layers:
      meta:
        prio: 30
  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0.4
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    layers: {}
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 79b6d87030178bed0088ad3b00aa6dfbabac37c4
    layers:
      meta-poky:
        prio: 25
      meta-yocto-bsp:
        prio: 25
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: c734c2cb9713dbd6d50697a9f6c25ebdf3ae589e
    layers:
      meta-oe:
        prio: 10
      meta-python:
        prio: 10
      meta-networking:
        prio: 10

bblayers_conf_header:
  meta-rcar-s4: |
    POKY_BBLAYERS_CONF_VERSION = "2"

local_conf_header:
  meta-rcar-s4: |
    # Strong assignment: BitBake adopts the *environment* TMPDIR as a datastore
    # variable, and Poky's `TMPDIR ?=` weak default loses to it — a pre-set
    # env TMPDIR (CI runners, agent scratch dirs) would put ALL build
    # artifacts outside the build dir. Pin it here so artifacts always land
    # in <workdir>/build/tmp.
    TMPDIR = "${TOPDIR}/tmp"
    PACKAGE_CLASSES ?= "package_rpm"
    EXTRA_IMAGE_FEATURES ?= "allow-root-login allow-empty-password empty-root-password"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
    CONF_VERSION = "2"
    DISTRO_FEATURES:append = " usrmerge systemd"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    DISTRO_FEATURES:remove = "ptest sysvinit"
    LICENSE_FLAGS_ACCEPTED = "non-commercial"
    export SOURCE_DATE_EPOCH = "${@time.strftime('%s', time.localtime())}"
    REPRODUCIBLE_TIMESTAMP_ROOTFS = "${@time.strftime('%s', time.localtime())}"
    PREFERRED_VERSION_linux-renesas = "6.18%"
    LINUXLIBCVERSION = "6.18%"
    PREFERRED_VERSION_linux-libc-headers = "6.6"
    PREFERRED_VERSION_nativesdk-linux-libc-headers = "6.6"
    # SBOM disabled by default (same as build.sh without --sbom)
    INHERIT:remove = "create-spdx"
