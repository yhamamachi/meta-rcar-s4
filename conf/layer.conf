# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rcar-s4"
BBFILE_PATTERN_rcar-s4 = "^${LAYERDIR}/"
BBFILE_PRIORITY_rcar-s4 = "6"
LAYERSERIES_COMPAT_rcar-s4 = "scarthgap"

LAYERDEPENDS_rcar-s4 = "core yocto yoctobsp openembedded-layer meta-python networking-layer"

